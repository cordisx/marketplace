name: Marketplace Check

on:
  pull_request:
    paths:
      - "plugins/**"
      - "trust/**"
      - "feed.config.json"
      - "marketplace.json"
      - "protocol.lock.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check.yml"
      - ".github/CODEOWNERS"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
